  // ============ Helpers ============
  // Helper: pick localized name for any object that has name / nameEn / nameUk
  function lname(obj) {
    if (lang === 'uk' && obj.nameUk) return obj.nameUk;
    if (lang === 'en' && obj.nameEn) return obj.nameEn;
    return obj.name;
  }

  function hexA(hex, a) {
    const c = hex.replace('#', '');
    return `rgba(${parseInt(c.substring(0,2),16)},${parseInt(c.substring(2,4),16)},${parseInt(c.substring(4,6),16)},${a})`;
  }
  function lighten(hex, amount, alpha = 1) {
    const c = hex.replace('#', '');
    const r = Math.min(255, parseInt(c.substring(0,2),16) + amount * 255);
    const g = Math.min(255, parseInt(c.substring(2,4),16) + amount * 255);
    const b = Math.min(255, parseInt(c.substring(4,6),16) + amount * 255);
    return `rgba(${r|0},${g|0},${b|0},${alpha})`;
  }
  function formatNumber(n) {
    const locale = lang === 'uk' ? 'uk-UA' : lang === 'en' ? 'en-US' : 'fr-FR';
    const sep = lang === 'en' ? ',' : ' ';
    return n.toLocaleString(locale).replace(/,/g, sep);
  }
  function formatPeriod(years) {
    if (years < 1) return `${(years * 365).toFixed(0)} ${lang === 'uk' ? 'днів' : lang === 'en' ? 'days' : 'jours'}`;
    if (years < 10) return `${years.toFixed(2)} ${lang === 'uk' ? 'р' : lang === 'en' ? 'yrs' : 'ans'}`;
    return `${years.toFixed(1)} ${lang === 'uk' ? 'р' : lang === 'en' ? 'yrs' : 'ans'}`;
  }
  function formatDay(hours) {
    if (hours < 100) return `${hours.toFixed(1)} h`;
    return `${(hours / 24).toFixed(0)} ${lang === 'uk' ? 'земних діб' : lang === 'en' ? 'Earth days' : 'j terrestres'}`;
  }
  function auToKmShort(au) {
    const km = au * AU_KM;
    if (km < 1e9) return `≈ ${(km / 1e6).toFixed(1)} M km`;
    return `≈ ${(km / 1e9).toFixed(2)} ${lang === 'uk' ? 'млрд' : lang === 'en' ? 'B' : 'Md'} km`;
  }

  // ============ Real planet positions (simplified Kepler) ============
  function realHeliocentricLongitude(planet, date) {
    // Days since J2000.0 (2000 Jan 1.5 TT)
    const J2000 = Date.UTC(2000, 0, 1, 12, 0, 0);
    const dCent = (date.getTime() - J2000) / (1000 * 86400 * 36525); // centuries
    const k = planet.kepler;
    if (!k) return planet.angleOffset;
    const L = k.L0 + k.rate * dCent; // deg
    const M = (L - k.peri) * Math.PI / 180;
    // Solve Kepler: M = E - e sin E
    let E = M;
    for (let i = 0; i < 6; i++) E = E - (E - k.e * Math.sin(E) - M) / (1 - k.e * Math.cos(E));
    const v = 2 * Math.atan2(Math.sqrt(1 + k.e) * Math.sin(E / 2), Math.sqrt(1 - k.e) * Math.cos(E / 2));
    const lambda = v + k.peri * Math.PI / 180;
    return lambda;
  }

  // ============ Mouse ============
  const mouse = { x: 0, y: 0, active: false };
  let hoveredPlanet = null;
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
    mouse.active = true;
    if (comparator.dragging && state.view === 'compare') {
      const dx = mouse.x - comparator.dragStartScreen.x;
      const dy = mouse.y - comparator.dragStartScreen.y;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) comparator.dragMoved = true;
      comparator.offsetX = comparator.dragStartOffset.x - dx / comparator.zoom;
      comparator.offsetY = comparator.dragStartOffset.y - dy / comparator.zoom;
      comparator.animating = false;
      // Track velocity for inertia
      const nowT = performance.now() / 1000;
      const dt = Math.max(0.005, nowT - comparator.lastDragTime);
      const vx = (mouse.x - comparator.lastDragX) / dt;
      const vy = (mouse.y - comparator.lastDragY) / dt;
      // Smooth (EMA) so a tiny final jitter doesn't kill momentum
      comparator.velocityX = comparator.velocityX * 0.4 + vx * 0.6;
      comparator.velocityY = comparator.velocityY * 0.4 + vy * 0.6;
      comparator.lastDragX = mouse.x; comparator.lastDragY = mouse.y;
      comparator.lastDragTime = nowT;
    }
    if (earthDrag.active && state.view === 'earth' && earthDrag.earthScreen) {
      // Compute new orbital angle from mouse position relative to Sun
      const es = earthDrag.earthScreen;
      // Normalize to circle (handle ellipse)
      const nx = (mouse.x - es.cx) / es.orbitR;
      const ny = (mouse.y - es.cy) / es.orbitRy;
      const theta = Math.atan2(ny, nx);
      // Progress: 0 = top of orbit (angle = -π/2)
      let progress = (theta + Math.PI / 2) / (Math.PI * 2);
      while (progress < 0) progress += 1;
      while (progress > 1) progress -= 1;
      const newV = progress * 1440;
      const prevV = earthDrag.lastSliderValue;
      if (Math.abs(newV - prevV) > 4 && Math.abs(newV - prevV) < 1436) earthDrag.moved = true;
      slider.value = newV;
      earthDrag.lastSliderValue = newV;
      updateLabels();
    }
  });
  canvas.addEventListener('mouseleave', () => { mouse.active = false; });
  canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (state.view === 'compare') {
      comparator.dragging = true; comparator.dragMoved = false;
      comparator.dragStartScreen = { x: mx, y: my };
      comparator.dragStartOffset = { x: comparator.offsetX, y: comparator.offsetY };
      comparator.velocityX = 0; comparator.velocityY = 0;
      comparator.lastDragX = mx; comparator.lastDragY = my;
      comparator.lastDragTime = performance.now() / 1000;
      canvas.style.cursor = 'grabbing';
    } else if (state.view === 'earth' && state.earthMode === 'season' && earthDrag.earthScreen) {
      // Start Earth drag if mouse is on Earth
      const es = earthDrag.earthScreen;
      const dx = mx - es.x, dy = my - es.y;
      if (dx*dx + dy*dy < (es.r + 14) ** 2) {
        earthDrag.active = true;
        earthDrag.moved = false;
        earthDrag.wasPlaying = playing;
        earthDrag.lastSliderValue = parseFloat(slider.value);
        playing = false;
        playBtn.textContent = '▶';
        canvas.style.cursor = 'grabbing';
      }
    }
  });
  window.addEventListener('mouseup', () => {
    if (comparator.dragging) {
      comparator.dragging = false;
      canvas.style.cursor = state.view === 'compare' ? 'grab' : 'default';
    }
    if (earthDrag.active) {
      earthDrag.active = false;
      if (earthDrag.wasPlaying) { playing = true; playBtn.textContent = '⏸'; }
      canvas.style.cursor = 'default';
    }
  });
  canvas.addEventListener('click', (e) => {
    // In compare view, suppress modal opening if it was a drag
    if (state.view === 'compare' && comparator.dragMoved) { comparator.dragMoved = false; return; }
    // In earth view, suppress modal if it was a drag
    if (state.view === 'earth' && earthDrag.moved) { earthDrag.moved = false; return; }
    if (!hoveredPlanet) return;
    if (state.view === 'compare') {
      const id = hoveredPlanet.kind === 'sun' ? 'sun' : hoveredPlanet.planetIndex;
      compareFlyTo(id);
      return;
    }
    // From solar view: clicking Earth takes you to the Earth detail view
    if (state.view === 'solar' && hoveredPlanet.kind === 'planet' && hoveredPlanet.planetIndex === 2) {
      setView('earth');
      return;
    }
    if (hoveredPlanet.kind === 'planet') openPlanetModal(hoveredPlanet.planetIndex);
    else if (hoveredPlanet.kind === 'sun') openSunModal();
  });
  // Wheel to zoom (compare view)
  canvas.addEventListener('wheel', (e) => {
    if (state.view !== 'compare') return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const w = window.innerWidth, h = window.innerHeight;
    // Convert mouse position to world coords BEFORE zoom change
    const before = compareScreenToWorld(mx, my, w, h);
    const factor = Math.exp(-e.deltaY * 0.001);
    comparator.zoom = Math.max(1e-11, Math.min(1, comparator.zoom * factor));
    comparator.animating = false;
    // Re-anchor: world point under cursor should stay at the same screen position
    const after = compareScreenToWorld(mx, my, w, h);
    comparator.offsetX += before.wx - after.wx;
    comparator.offsetY += before.wy - after.wy;
  }, { passive: false });

  // Touch handlers (compare view: drag, pinch; other views: hover/click)
  canvas.addEventListener('touchstart', (e) => {
    const rect = canvas.getBoundingClientRect();
    if (e.touches.length === 1) {
      const tt = e.touches[0];
      mouse.x = tt.clientX - rect.left; mouse.y = tt.clientY - rect.top;
      mouse.active = true;
      if (state.view === 'compare') {
        comparator.dragging = true; comparator.dragMoved = false;
        comparator.dragStartScreen = { x: mouse.x, y: mouse.y };
        comparator.dragStartOffset = { x: comparator.offsetX, y: comparator.offsetY };
        comparator.velocityX = 0; comparator.velocityY = 0;
        comparator.lastDragX = mouse.x; comparator.lastDragY = mouse.y;
        comparator.lastDragTime = performance.now() / 1000;
        comparator.pinch = null;
      } else if (state.view === 'earth' && state.earthMode === 'season' && earthDrag.earthScreen) {
        const es = earthDrag.earthScreen;
        const dx = mouse.x - es.x, dy = mouse.y - es.y;
        if (dx*dx + dy*dy < (es.r + 18) ** 2) {
          earthDrag.active = true;
          earthDrag.moved = false;
          earthDrag.wasPlaying = playing;
          earthDrag.lastSliderValue = parseFloat(slider.value);
          playing = false;
          playBtn.textContent = '▶';
        }
      }
    } else if (e.touches.length === 2 && state.view === 'compare') {
      const t1 = e.touches[0], t2 = e.touches[1];
      const dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
      const dist = Math.hypot(dx, dy);
      const midX = (t1.clientX + t2.clientX) / 2 - rect.left;
      const midY = (t1.clientY + t2.clientY) / 2 - rect.top;
      comparator.pinch = { dist, midX, midY, startZoom: comparator.zoom,
        startOffsetX: comparator.offsetX, startOffsetY: comparator.offsetY };
      comparator.dragging = false;
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    const rect = canvas.getBoundingClientRect();
    if (e.touches.length === 1 && comparator.dragging && state.view === 'compare') {
      const tt = e.touches[0];
      const x = tt.clientX - rect.left, y = tt.clientY - rect.top;
      const dx = x - comparator.dragStartScreen.x, dy = y - comparator.dragStartScreen.y;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) comparator.dragMoved = true;
      comparator.offsetX = comparator.dragStartOffset.x - dx / comparator.zoom;
      comparator.offsetY = comparator.dragStartOffset.y - dy / comparator.zoom;
      comparator.animating = false;
      // Track velocity for inertia
      const nowT = performance.now() / 1000;
      const tdt = Math.max(0.005, nowT - comparator.lastDragTime);
      const vx = (x - comparator.lastDragX) / tdt;
      const vy = (y - comparator.lastDragY) / tdt;
      comparator.velocityX = comparator.velocityX * 0.4 + vx * 0.6;
      comparator.velocityY = comparator.velocityY * 0.4 + vy * 0.6;
      comparator.lastDragX = x; comparator.lastDragY = y;
      comparator.lastDragTime = nowT;
      mouse.x = x; mouse.y = y;
    } else if (e.touches.length === 1 && earthDrag.active && state.view === 'earth' && earthDrag.earthScreen) {
      e.preventDefault();
      const tt = e.touches[0];
      const x = tt.clientX - rect.left, y = tt.clientY - rect.top;
      mouse.x = x; mouse.y = y;
      const es = earthDrag.earthScreen;
      const nx = (x - es.cx) / es.orbitR;
      const ny = (y - es.cy) / es.orbitRy;
      const theta = Math.atan2(ny, nx);
      let progress = (theta + Math.PI / 2) / (Math.PI * 2);
      while (progress < 0) progress += 1;
      while (progress > 1) progress -= 1;
      const newV = progress * 1440;
      if (Math.abs(newV - earthDrag.lastSliderValue) > 4 && Math.abs(newV - earthDrag.lastSliderValue) < 1436) earthDrag.moved = true;
      slider.value = newV;
      earthDrag.lastSliderValue = newV;
      updateLabels();
    } else if (e.touches.length === 2 && comparator.pinch && state.view === 'compare') {
      e.preventDefault();
      const t1 = e.touches[0], t2 = e.touches[1];
      const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      const factor = dist / comparator.pinch.dist;
      const w = window.innerWidth, h = window.innerHeight;
      // Recompute around midpoint
      const mx = comparator.pinch.midX, my = comparator.pinch.midY;
      const tempZoom = Math.max(1e-9, Math.min(1, comparator.pinch.startZoom * factor));
      // Restore pinch start state, then rezoom anchored to midpoint
      comparator.zoom = comparator.pinch.startZoom;
      comparator.offsetX = comparator.pinch.startOffsetX;
      comparator.offsetY = comparator.pinch.startOffsetY;
      const before = compareScreenToWorld(mx, my, w, h);
      comparator.zoom = tempZoom;
      const after = compareScreenToWorld(mx, my, w, h);
      comparator.offsetX += before.wx - after.wx;
      comparator.offsetY += before.wy - after.wy;
      comparator.animating = false;
    }
  }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      if (comparator.dragging) comparator.dragging = false;
      comparator.pinch = null;
      if (earthDrag.active) {
        earthDrag.active = false;
        if (earthDrag.wasPlaying) { playing = true; playBtn.textContent = '⏸'; }
      }
      setTimeout(() => { mouse.active = false; }, 50);
    }
  });

  // ============ Background ============
  function drawBackground(w, h, dt) {
    ctx.clearRect(0, 0, w, h);

    // Milky way diffuse band
    if (state.settings.milkyway) {
      const mwGrad = ctx.createLinearGradient(0, 0, w, h);
      mwGrad.addColorStop(0, 'rgba(180,200,255,0)');
      mwGrad.addColorStop(0.45, 'rgba(180,200,255,0.04)');
      mwGrad.addColorStop(0.55, 'rgba(180,200,255,0.04)');
      mwGrad.addColorStop(1, 'rgba(180,200,255,0)');
      ctx.fillStyle = mwGrad;
      ctx.fillRect(0, 0, w, h);
    }

    for (const s of stars) {
      if (s.mw && !state.settings.milkyway) continue;
      s.twinkle += dt * 2;
      const a = s.a * (0.7 + 0.3 * Math.sin(s.twinkle));
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    if (state.settings.constellations) {
      const compact = w < 760;
      const yBias = compact ? 0.18 : 0;
      const yScale = compact ? 0.7 : 1;
      ctx.strokeStyle = 'rgba(150,180,255,0.18)'; ctx.lineWidth = 1;
      for (const c of CONSTELLATIONS) {
        const pts = c.pts.map(p => [p[0] * w, (p[1] * yScale + yBias) * h]);
        ctx.beginPath();
        for (const [a, b] of c.lines) { ctx.moveTo(pts[a][0], pts[a][1]); ctx.lineTo(pts[b][0], pts[b][1]); }
        ctx.stroke();
        for (const [x, y] of pts) {
          ctx.fillStyle = 'rgba(220,230,255,0.95)';
          ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(180,200,255,0.25)';
          ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
        }
        if (!compact) {
          ctx.fillStyle = 'rgba(150,180,255,0.35)';
          ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(lname(c), pts[0][0] + 6, pts[0][1] - 6);
        }
      }
    }
    maybeSpawnShootingStar(w, h);
    if (shootingStar) {
      shootingStar.x += shootingStar.vx * dt;
      shootingStar.y += shootingStar.vy * dt;
      shootingStar.life -= dt * 0.8;
      if (shootingStar.life <= 0 || shootingStar.x > w || shootingStar.y > h) shootingStar = null;
      else {
        const grad = ctx.createLinearGradient(shootingStar.x, shootingStar.y,
          shootingStar.x - shootingStar.vx * 0.3, shootingStar.y - shootingStar.vy * 0.3);
        grad.addColorStop(0, `rgba(255,255,255,${shootingStar.life})`);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = grad; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(shootingStar.x, shootingStar.y);
        ctx.lineTo(shootingStar.x - shootingStar.vx * 0.3, shootingStar.y - shootingStar.vy * 0.3);
        ctx.stroke();
      }
    }
  }

  function updateComet(w, h, dt) {
    maybeSpawnComet(w, h, dt);
    if (!comet) return;
    comet.x += comet.vx * dt; comet.y += comet.vy * dt;
    if (comet.x < -100 || comet.x > w + 100 || comet.y < -100 || comet.y > h + 100) { comet = null; return; }
    const dx = comet.x - cx, dy = comet.y - cy;
    const len = Math.hypot(dx, dy) || 1;
    const tx = dx / len, ty = dy / len;
    const tailLen = 110;
    const grad = ctx.createLinearGradient(comet.x, comet.y, comet.x + tx * tailLen, comet.y + ty * tailLen);
    grad.addColorStop(0, 'rgba(180,220,255,0.8)');
    grad.addColorStop(0.4, 'rgba(120,180,255,0.4)');
    grad.addColorStop(1, 'rgba(120,180,255,0)');
    ctx.strokeStyle = grad; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(comet.x, comet.y);
    ctx.lineTo(comet.x + tx * tailLen, comet.y + ty * tailLen); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(comet.x, comet.y, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(200,230,255,0.4)';
    ctx.beginPath(); ctx.arc(comet.x, comet.y, 6, 0, Math.PI * 2); ctx.fill();
  }

  // ============ Solar System ============
  function getPlanetAngle(p, simYears) {
    if (state.settings.realPositions) {
      // Use real positions today, slowly advancing with slider
      const baseDate = new Date();
      const advanceMs = simYears * 365.25 * 86400 * 1000;
      const date = new Date(baseDate.getTime() + advanceMs);
      return realHeliocentricLongitude(p, date);
    }
    const orbits = simYears / p.period;
    return p.angleOffset + orbits * Math.PI * 2;
  }

  function drawSolar(sliderHours, dt) {
    hoveredPlanet = null;
    for (let i = 0; i < PLANETS.length; i++) {
      const p = PLANETS[i];
      const isFocus = state.highlightedPlanet === -1 || state.highlightedPlanet === i;
      ctx.strokeStyle = isFocus ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, p.distance * scale, 0, Math.PI * 2); ctx.stroke();
    }
    const simYears = (sliderHours / 24) * state.timeScaleYears;
    ctx.fillStyle = 'rgba(200,180,150,0.55)';
    for (const a of ASTEROIDS) {
      const orbits = simYears / a.period;
      const ang = a.angleOffset + orbits * Math.PI * 2;
      const r = a.distance * scale;
      const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
      ctx.beginPath(); ctx.arc(x, y, a.size, 0, Math.PI * 2); ctx.fill();
    }

    const sunR = Math.max(13, 22 * displayScale);
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunR * 4);
    glow.addColorStop(0, 'rgba(255,209,102,0.6)');
    glow.addColorStop(0.4, 'rgba(255,140,40,0.25)');
    glow.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, sunR * 4, 0, Math.PI * 2); ctx.fill();
    const pulse = 1 + 0.04 * Math.sin(performance.now() / 800);
    const sg = ctx.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, sunR * pulse);
    sg.addColorStop(0, '#fff5cc'); sg.addColorStop(0.6, '#ffd166'); sg.addColorStop(1, '#ff8c28');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(cx, cy, sunR * pulse, 0, Math.PI * 2); ctx.fill();

    if (mouse.active) {
      const dx = mouse.x - cx, dy = mouse.y - cy;
      if (dx * dx + dy * dy < (sunR + 14) ** 2) {
        hoveredPlanet = { kind: 'sun', name: lang === 'uk' ? 'Сонце' : lang === 'en' ? 'Sun' : 'Soleil',
          info: lang === 'uk' ? 'Наша зірка · натисни для деталей' : lang === 'en' ? 'Our star · click for details' : 'Notre étoile · clic pour la fiche',
          x: cx, y: cy };
      }
    }

    for (let i = 0; i < PLANETS.length; i++) {
      const p = PLANETS[i];
      const angle = getPlanetAngle(p, simYears);
      const r = p.distance * scale;
      const x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
      const isFocus = state.highlightedPlanet === -1 || state.highlightedPlanet === i;
      const alpha = isFocus ? 1 : 0.25;
      const pr = Math.max(2.2, p.radius * displayScale);

      const pGlow = ctx.createRadialGradient(x, y, 0, x, y, pr * 3);
      pGlow.addColorStop(0, hexA(p.color, 0.5 * alpha));
      pGlow.addColorStop(1, hexA(p.color, 0));
      ctx.fillStyle = pGlow;
      ctx.beginPath(); ctx.arc(x, y, pr * 3, 0, Math.PI * 2); ctx.fill();

      if (p.hasRings) {
        ctx.save();
        ctx.translate(x, y); ctx.rotate(0.4); ctx.scale(1, 0.35);
        ctx.strokeStyle = hexA('#e8d39c', 0.65 * alpha); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, pr * 2.1, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = hexA('#c9b478', 0.45 * alpha); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, 0, pr * 2.5, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }

      const grad = ctx.createRadialGradient(x - pr * 0.4, y - pr * 0.4, 0, x, y, pr);
      grad.addColorStop(0, lighten(p.color, 0.3, alpha));
      grad.addColorStop(1, hexA(p.color, alpha));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, pr, 0, Math.PI * 2); ctx.fill();

      if (isFocus && window.innerWidth > 460) {
        const name = lname(p);
        ctx.fillStyle = `rgba(232,238,249,${0.85 * alpha})`;
        ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(name, x, y - pr - 8);
      }

      if (mouse.active && !hoveredPlanet) {
        const dx = mouse.x - x, dy = mouse.y - y;
        if (dx * dx + dy * dy < (pr + 12) ** 2) {
          hoveredPlanet = { kind: 'planet',
            name: lname(p),
            info: `${p.type[lang]} · ${lang === 'uk' ? 'натисни для деталей' : lang === 'en' ? 'click for details' : 'clic pour la fiche'}`,
            x, y, planetIndex: i };
        }
      }
    }
    updateComet(window.innerWidth, window.innerHeight, dt);
  }

  // ============ Earth texture ============
  const TEXTURE_W = 360, TEXTURE_H = 180;
  let earthTexClear = null, earthTexCloudy = null;
  function isLand(latDeg, lonDeg) {
    function inEll(lc, oc, lr, or_) {
      const dlat = latDeg - lc;
      let dlon = lonDeg - oc;
      if (dlon > 180) dlon -= 360; if (dlon < -180) dlon += 360;
      return (dlat*dlat)/(lr*lr) + (dlon*dlon)/(or_*or_) < 1;
    }
    if (inEll(48, -100, 18, 28)) return true;
    if (inEll(62, -100, 10, 38)) return true;
    if (inEll(28, -100, 10, 12)) return true;
    if (inEll(15, -85, 6, 8)) return true;
    if (inEll(72, -40, 9, 12)) return true;
    if (inEll(-15, -60, 28, 13)) return true;
    if (inEll(0, -55, 8, 18)) return true;
    if (inEll(5, 18, 28, 18)) return true;
    if (inEll(-15, 25, 18, 13)) return true;
    if (inEll(50, 15, 14, 22)) return true;
    if (inEll(63, 50, 10, 38)) return true;
    if (inEll(50, 90, 18, 50)) return true;
    if (inEll(60, 100, 12, 45)) return true;
    if (inEll(22, 80, 12, 15)) return true;
    if (inEll(30, 105, 12, 22)) return true;
    if (inEll(0, 110, 6, 16)) return true;
    if (inEll(-25, 135, 9, 14)) return true;
    if (latDeg < -65) return true;
    if (inEll(-20, 47, 6, 3)) return true;
    if (inEll(54, -3, 5, 5)) return true;
    if (inEll(37, 138, 7, 4)) return true;
    if (inEll(-42, 173, 4, 3)) return true;
    return false;
  }
  function isDesert(latDeg, lonDeg) {
    if (latDeg > 12 && latDeg < 32 && lonDeg > -15 && lonDeg < 40) return true;
    if (latDeg > 15 && latDeg < 32 && lonDeg > 35 && lonDeg < 60) return true;
    if (latDeg > -32 && latDeg < -20 && lonDeg > 120 && lonDeg < 145) return true;
    if (latDeg > 30 && latDeg < 42 && lonDeg > -120 && lonDeg < -105) return true;
    return false;
  }
  function cloudIntensity(latDeg, lonDeg) {
    const a = Math.sin(latDeg * 0.09 + lonDeg * 0.05) * 0.5
            + Math.sin(latDeg * 0.18 - lonDeg * 0.12) * 0.5
            + Math.sin(lonDeg * 0.08 + 1.3) * 0.4
            + Math.cos(latDeg * 0.12) * 0.3;
    const eq = Math.exp(-((latDeg) ** 2) / 600) * 0.4;
    return Math.max(0, Math.min(1, (a * 0.25) + eq));
  }
  function buildEarthTextures() {
    earthTexClear = new Uint8ClampedArray(TEXTURE_W * TEXTURE_H * 4);
    earthTexCloudy = new Uint8ClampedArray(TEXTURE_W * TEXTURE_H * 4);
    for (let ty = 0; ty < TEXTURE_H; ty++) {
      const latDeg = (ty / TEXTURE_H) * 180 - 90;
      for (let tx = 0; tx < TEXTURE_W; tx++) {
        const lonDeg = (tx / TEXTURE_W) * 360 - 180;
        const idx = (ty * TEXTURE_W + tx) * 4;
        let r, g, b;
        if (latDeg > 70 || latDeg < -65) {
          r = 230 + Math.random() * 25; g = 240 + Math.random() * 15; b = 250;
        } else if (isLand(latDeg, lonDeg)) {
          if (isDesert(latDeg, lonDeg)) {
            r = 205 + Math.random() * 25; g = 175 + Math.random() * 25; b = 115 + Math.random() * 20;
          } else {
            r = 55 + Math.random() * 30; g = 115 + Math.random() * 35; b = 55 + Math.random() * 25;
          }
          if (Math.random() < 0.1) { r -= 25; g -= 25; b -= 15; }
        } else {
          const dep = Math.sin(latDeg * 0.1) * Math.cos(lonDeg * 0.1) * 0.5 + 0.5;
          r = 15 + dep * 12; g = 55 + dep * 25; b = 120 + dep * 40;
        }
        earthTexClear[idx]=r; earthTexClear[idx+1]=g; earthTexClear[idx+2]=b; earthTexClear[idx+3]=255;
        const c = cloudIntensity(latDeg, lonDeg);
        earthTexCloudy[idx]   = Math.min(255, r * (1 - c * 0.75) + 245 * c * 0.75);
        earthTexCloudy[idx+1] = Math.min(255, g * (1 - c * 0.75) + 248 * c * 0.75);
        earthTexCloudy[idx+2] = Math.min(255, b * (1 - c * 0.75) + 252 * c * 0.75);
        earthTexCloudy[idx+3] = 255;
      }
    }
  }

  let spherePixels = null;
  function buildSpherePixels(R, viewTilt) {
    const size = Math.ceil(R * 2) + 2;
    const cT = Math.cos(viewTilt), sT = Math.sin(viewTilt);
    const arr = [];
    for (let py = 0; py < size; py++) {
      const sy = ((py + 0.5) - size / 2) / R;
      for (let px = 0; px < size; px++) {
        const sx = ((px + 0.5) - size / 2) / R;
        const r2 = sx * sx + sy * sy;
        if (r2 > 1) continue;
        const nz = Math.sqrt(1 - r2);
        const wx = sx;
        const wy = -sy * cT + nz * sT;
        const wz = sy * sT + nz * cT;
        const lit = Math.max(0.13, sx * 0.85 + 0.25);
        const rimFade = Math.min(1, (1 - r2) * 4);
        arr.push({ px, py, wx, wy, wz, lit, rimFade });
      }
    }
    spherePixels = { size, arr };
  }
  // Off-screen canvas so we can blend the textured sphere onto the main canvas
  // without putImageData wiping the stars behind the bounding box.
  let earthOffCanvas = null, earthOffCtx = null;
  function renderEarthSphere(x0, y0, R, earthRotation, useClouds) {
    if (!spherePixels) return;
    const tex = useClouds ? earthTexCloudy : earthTexClear;
    const size = spherePixels.size;
    if (!earthOffCanvas || earthOffCanvas.width !== size) {
      earthOffCanvas = document.createElement('canvas');
      earthOffCanvas.width = size;
      earthOffCanvas.height = size;
      earthOffCtx = earthOffCanvas.getContext('2d');
    }
    const img = earthOffCtx.createImageData(size, size);
    const data = img.data;
    const cR = Math.cos(earthRotation), sR = Math.sin(earthRotation);
    const arr = spherePixels.arr;
    const INV_2PI = 1 / (Math.PI * 2), INV_PI = 1 / Math.PI;
    for (let i = 0; i < arr.length; i++) {
      const p = arr[i];
      const ex = p.wx * cR - p.wz * sR;
      const ez = p.wx * sR + p.wz * cR;
      const ey = p.wy;
      const lat = Math.asin(ey > 1 ? 1 : ey < -1 ? -1 : ey);
      const lon = Math.atan2(ez, ex);
      let tx = (lon + Math.PI) * INV_2PI * TEXTURE_W;
      let ty = (lat + Math.PI / 2) * INV_PI * TEXTURE_H;
      tx = ((tx | 0) % TEXTURE_W + TEXTURE_W) % TEXTURE_W;
      ty = ty < 0 ? 0 : (ty >= TEXTURE_H ? TEXTURE_H - 1 : (ty | 0));
      const tIdx = (ty * TEXTURE_W + tx) * 4;
      const dIdx = (p.py * size + p.px) * 4;
      const k = p.lit;
      data[dIdx]=tex[tIdx]*k; data[dIdx+1]=tex[tIdx+1]*k; data[dIdx+2]=tex[tIdx+2]*k;
      data[dIdx+3]=255*p.rimFade;
    }
    // putImageData on the off-screen — fully replaces (incl. alpha=0 outside disc)
    earthOffCtx.putImageData(img, 0, 0);
    // drawImage respects per-pixel alpha → background pixels behind the
    // square stay intact, only the disc is composited onto the main canvas.
    ctx.drawImage(earthOffCanvas, Math.round(x0 - size / 2), Math.round(y0 - size / 2));
  }
  function projectSurfacePoint(lat, lon, earthRotation, R) {
    const cl = Math.cos(lat), sl = Math.sin(lat);
    const xE = cl * Math.cos(lon), zE = cl * Math.sin(lon);
    const cR = Math.cos(earthRotation), sR = Math.sin(earthRotation);
    const wx = xE * cR + zE * sR;
    const wz = -xE * sR + zE * cR;
    const wy = sl;
    const cT = Math.cos(VIEW_TILT), sT = Math.sin(VIEW_TILT);
    const x_ = wx;
    const y_ = wy * cT - wz * sT;
    const z_ = wy * sT + wz * cT;
    return { sx: x_ * R, sy: -y_ * R, visible: z_ > 0, lit: x_ > 0 };
  }

  // ============ Earth & Moon ============
  function drawEarth(sliderHours, dt) {
    hoveredPlanet = null;
    const progress = sliderHours / 24;
    let earthRotation, moonAngle;
    if (state.earthMode === 'day') {
      earthRotation = ((sliderHours - 12) / 12) * Math.PI + LYON_LON;
      moonAngle = Math.PI + progress * (Math.PI * 2 / LUNAR_MONTH_DAYS);
    } else {
      earthRotation = progress * Math.PI * 2 * 0.05 + LYON_LON;
      moonAngle = Math.PI + progress * Math.PI * 2;
    }
    const w = window.innerWidth;
    const sunMargin = w < 760 ? 28 : 60;
    const sunX = Math.min(cx + 380, w - sunMargin);
    const sunY = cy;
    drawSunIndicator(sunX, sunY);

    // Moon orbit
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.ellipse(cx, cy, MOON_ORBIT_RADIUS, MOON_ORBIT_RADIUS * Math.sin(VIEW_TILT) + 4, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    const moonX = cx + Math.cos(moonAngle) * MOON_ORBIT_RADIUS;
    const moonY = cy + Math.sin(moonAngle) * MOON_ORBIT_RADIUS * Math.sin(VIEW_TILT);

    if (state.settings.tides) drawTides(cx, cy, EARTH_RADIUS, moonAngle);
    if (state.settings.atmosphere) drawAtmosphere(cx, cy, EARTH_RADIUS);

    renderEarthSphere(cx, cy, EARTH_RADIUS, earthRotation, state.settings.clouds);

    drawCityMarker(cx, cy, EARTH_RADIUS, earthRotation);

    // Axis
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-AXIAL_TILT);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.setLineDash([2, 3]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -EARTH_RADIUS - 16); ctx.lineTo(0, EARTH_RADIUS + 16); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '9px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('23,5°', 6, -EARTH_RADIUS - 6);
    ctx.restore();

    // ISS
    if (state.settings.iss && !state.settings.issLive) drawISS(cx, cy, EARTH_RADIUS, sliderHours);
    if (state.settings.issLive && state.iss) drawLiveISS(cx, cy, EARTH_RADIUS, earthRotation);

    // Eclipse shadow rendering BEFORE moon
    drawEclipseShadow(cx, cy, EARTH_RADIUS, moonX, moonY, MOON_RADIUS, moonAngle);

    // Moon
    drawMoonBody(moonX, moonY, MOON_RADIUS);

    ctx.fillStyle = 'rgba(232,238,249,0.85)';
    ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(lang === 'uk' ? 'Земля' : lang === 'en' ? 'Earth' : 'Terre', cx, cy + EARTH_RADIUS + 24);
    ctx.fillText(lang === 'uk' ? 'Місяць' : lang === 'en' ? 'Moon' : 'Lune', moonX, moonY + MOON_RADIUS + 16);

    if (mouse.active) {
      const dE = (mouse.x - cx) ** 2 + (mouse.y - cy) ** 2;
      const dM = (mouse.x - moonX) ** 2 + (mouse.y - moonY) ** 2;
      if (dE < (EARTH_RADIUS + 8) ** 2) {
        hoveredPlanet = { kind: 'planet', name: lang === 'uk' ? 'Земля' : lang === 'en' ? 'Earth' : 'Terre',
          info: lang === 'uk' ? 'Наш дім · натисни для деталей' : lang === 'en' ? 'Our home · click for details' : 'Notre maison · clic pour la fiche',
          x: cx, y: cy, planetIndex: 2 };
      } else if (dM < (MOON_RADIUS + 8) ** 2) {
        const illum = (1 - Math.cos(moonAngle)) / 2;
        hoveredPlanet = { kind: 'moon', name: lang === 'uk' ? 'Місяць' : lang === 'en' ? 'Moon' : 'Lune',
          info: `${lang === 'uk' ? 'На відстані 384 400 км' : lang === 'en' ? '384,400 km away' : 'À 384 400 km'} · ${(illum * 100).toFixed(0)}%`,
          x: moonX, y: moonY };
      }
    }
    drawMoonPhase(moonAngle);
    detectEclipse(moonAngle);
  }

  function drawSunIndicator(sunX, sunY) {
    const sunR = Math.max(20, 36 * displayScale);
    const rayWidth = Math.min(220, sunX);
    const rayHeight = Math.min(window.innerHeight * 0.5, 360);
    const rayGrad = ctx.createLinearGradient(sunX - rayWidth, sunY, sunX, sunY);
    rayGrad.addColorStop(0, 'rgba(255,209,102,0)');
    rayGrad.addColorStop(1, 'rgba(255,209,102,0.10)');
    ctx.fillStyle = rayGrad;
    ctx.fillRect(sunX - rayWidth, sunY - rayHeight / 2, rayWidth, rayHeight);
    const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 3);
    glow.addColorStop(0, 'rgba(255,209,102,0.5)');
    glow.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR * 3, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(sunX - 6, sunY - 6, 2, sunX, sunY, sunR);
    g.addColorStop(0, '#fff5cc'); g.addColorStop(0.6, '#ffd166'); g.addColorStop(1, '#ff8c28');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,209,102,0.8)';
    ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(lang === 'uk' ? '☀ Сонце' : lang === 'en' ? '☀ Sun' : '☀ Soleil', sunX, sunY + sunR + 18);
  }

  function drawTides(x, y, R, moonAngle) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(moonAngle);
    ctx.scale(1, Math.sin(VIEW_TILT) + 0.35);
    ctx.fillStyle = 'rgba(74, 158, 255, 0.32)';
    ctx.beginPath(); ctx.ellipse(0, 0, R * 1.12, R * 0.92, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawAtmosphere(x, y, R) {
    const aGrad = ctx.createRadialGradient(x, y, R, x, y, R * 1.18);
    aGrad.addColorStop(0, 'rgba(120, 180, 255, 0)');
    aGrad.addColorStop(0.5, 'rgba(120, 180, 255, 0.25)');
    aGrad.addColorStop(1, 'rgba(120, 180, 255, 0)');
    ctx.fillStyle = aGrad;
    ctx.beginPath(); ctx.arc(x, y, R * 1.18, 0, Math.PI * 2); ctx.fill();
  }

  function drawCityMarker(x0, y0, R, earthRotation) {
    const proj = projectSurfacePoint(LYON_LAT, LYON_LON, earthRotation, R);
    if (!proj.visible) return;
    const x = x0 + proj.sx, y = y0 + proj.sy;
    ctx.fillStyle = '#ff5050';
    ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(255,80,80,${proj.lit ? 0.85 : 0.5})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = `rgba(255,180,180,${proj.lit ? 0.95 : 0.7})`;
    ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Lyon', x + 8, y + 3);
  }

  function drawISS(x, y, R, sliderHours) {
    const issOrbits = state.earthMode === 'month'
      ? (sliderHours / 24) * LUNAR_MONTH_DAYS * 16
      : (sliderHours / 24) * 16;
    const ang = Math.PI / 2 + issOrbits * Math.PI * 2;
    const r = R + 12;
    const ix = x + Math.cos(ang) * r;
    const iy = y + Math.sin(ang) * r * Math.sin(VIEW_TILT) * 2;
    ctx.strokeStyle = 'rgba(100,200,255,0.18)';
    ctx.setLineDash([2, 4]);
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * Math.sin(VIEW_TILT) * 2, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#9fd9ff';
    ctx.beginPath(); ctx.arc(ix, iy, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(159,217,255,0.4)';
    ctx.beginPath(); ctx.arc(ix, iy, 5, 0, Math.PI * 2); ctx.fill();
  }

  function drawLiveISS(x, y, R, earthRotation) {
    if (!state.iss) return;
    const lat = state.iss.lat * Math.PI / 180;
    const lon = state.iss.lon * Math.PI / 180;
    const proj = projectSurfacePoint(lat, lon, earthRotation, R + 12);
    if (!proj.visible) return;
    const ix = x + proj.sx, iy = y + proj.sy;
    ctx.strokeStyle = 'rgba(100,200,255,0.18)';
    ctx.setLineDash([2, 4]);
    ctx.beginPath();
    ctx.ellipse(x, y, R + 12, (R + 12) * Math.sin(VIEW_TILT) * 2, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#9fd9ff';
    ctx.beginPath(); ctx.arc(ix, iy, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(159,217,255,0.5)';
    ctx.beginPath(); ctx.arc(ix, iy, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#9fd9ff';
    ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('ISS', ix + 10, iy + 3);
  }

  function drawEclipseShadow(eX, eY, eR, mX, mY, mR, moonAngle) {
    // Solar eclipse: moon between earth and sun → moon casts shadow toward earth
    // We approximate the shadow as a triangle/cone from Moon to Earth direction
    const a = ((moonAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const distToNew = Math.min(a, Math.abs(a - Math.PI * 2));
    const distToFull = Math.abs(a - Math.PI);
    if (distToNew < 0.18) {
      // Moon shadow projected toward Earth (left, since sun is right)
      ctx.save();
      const cone = ctx.createLinearGradient(mX, mY, eX, eY);
      cone.addColorStop(0, 'rgba(0,0,15,0.5)');
      cone.addColorStop(1, 'rgba(0,0,15,0)');
      ctx.fillStyle = cone;
      ctx.beginPath();
      ctx.moveTo(mX, mY - mR * 0.6);
      ctx.lineTo(eX, eY - eR * 0.4);
      ctx.lineTo(eX, eY + eR * 0.4);
      ctx.lineTo(mX, mY + mR * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if (distToFull < 0.18) {
      // Lunar eclipse: Earth shadow falls on the moon (reddish)
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      const shadow = ctx.createRadialGradient(mX, mY, 0, mX, mY, mR);
      shadow.addColorStop(0, 'rgba(140,40,30,0.85)');
      shadow.addColorStop(0.7, 'rgba(80,20,20,0.6)');
      shadow.addColorStop(1, 'rgba(40,10,10,0.4)');
      ctx.fillStyle = shadow;
      ctx.beginPath(); ctx.arc(mX, mY, mR, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawMoonBody(x, y, R) {
    const glow = ctx.createRadialGradient(x, y, 0, x, y, R * 1.7);
    glow.addColorStop(0, 'rgba(220,220,220,0.18)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, R * 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#cfcfcf'; ctx.fillRect(x - R, y - R, R * 2, R * 2);
    ctx.fillStyle = 'rgba(120,120,120,0.5)';
    for (const [dx, dy, s] of [
      [-0.3,-0.4,0.18],[0.4,0.2,0.22],[-0.1,0.5,0.14],
      [0.5,-0.5,0.12],[0.1,-0.1,0.1],[-0.5,0.1,0.16]]) {
      ctx.beginPath(); ctx.arc(x + dx * R, y + dy * R, s * R, 0, Math.PI * 2); ctx.fill();
    }
    const shade = ctx.createLinearGradient(x - R, y, x + R, y);
    shade.addColorStop(0, 'rgba(0,0,15,0.85)');
    shade.addColorStop(0.45, 'rgba(0,0,15,0.55)');
    shade.addColorStop(0.55, 'rgba(0,0,15,0)');
    shade.addColorStop(1, 'rgba(0,0,15,0)');
    ctx.fillStyle = shade;
    ctx.fillRect(x - R, y - R, R * 2, R * 2);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
  }

  // ============ Earth orbit view (formerly "Seasons") ============
  // Unified view: Earth orbits Sun · Moon orbits Earth · eclipses · drag Earth interactively
  function drawSeasons(sliderHours) {
    hoveredPlanet = null;
    const progress = sliderHours / 24;
    const sunR = 32;
    const sunGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunR * 3);
    sunGlow.addColorStop(0, 'rgba(255,209,102,0.5)');
    sunGlow.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = sunGlow;
    ctx.beginPath(); ctx.arc(cx, cy, sunR * 3, 0, Math.PI * 2); ctx.fill();
    const sg = ctx.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, sunR);
    sg.addColorStop(0, '#fff5cc'); sg.addColorStop(0.6, '#ffd166'); sg.addColorStop(1, '#ff8c28');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(cx, cy, sunR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,209,102,0.8)';
    ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(lang === 'uk' ? 'Сонце' : lang === 'en' ? 'Sun' : 'Soleil', cx, cy + sunR + 14);
    const orbitR = Math.min(window.innerWidth, window.innerHeight) * 0.32;
    const orbitRy = orbitR * 0.45;
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.ellipse(cx, cy, orbitR, orbitRy, 0, 0, Math.PI * 2); ctx.stroke();
    const seasons = [
      { day: 79,  key: 'spring' }, { day: 172, key: 'summer' },
      { day: 266, key: 'autumn' }, { day: 355, key: 'winter' },
    ];
    for (const s of seasons) {
      const t2 = s.day / 365;
      const a = -Math.PI / 2 + t2 * Math.PI * 2;
      const px = cx + Math.cos(a) * orbitR;
      const py = cy + Math.sin(a) * orbitRy;
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
      const offY = py < cy ? -10 : 16;
      ctx.fillText(t(s.key), px, py + offY);
    }
    const tt2 = progress;
    const ea = -Math.PI / 2 + tt2 * Math.PI * 2;
    const ex = cx + Math.cos(ea) * orbitR;
    const ey = cy + Math.sin(ea) * orbitRy;
    const earthR = 34;
    const eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, earthR * 1.6);
    eg.addColorStop(0, 'rgba(80,140,255,0.25)');
    eg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(ex, ey, earthR * 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(ex, ey, earthR, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#0e3a7a';
    ctx.fillRect(ex - earthR, ey - earthR, earthR * 2, earthR * 2);
    ctx.save();
    ctx.translate(ex, ey);
    drawSimpleContinents(earthR);
    ctx.restore();
    const dxs = cx - ex, dys = cy - ey;
    const sunAngleFromEarth = Math.atan2(dys, dxs);
    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(sunAngleFromEarth);
    const shade = ctx.createLinearGradient(-earthR, 0, earthR, 0);
    shade.addColorStop(0, 'rgba(0,0,15,0.85)');
    shade.addColorStop(0.45, 'rgba(0,0,15,0.55)');
    shade.addColorStop(0.55, 'rgba(0,0,15,0)');
    shade.addColorStop(1, 'rgba(0,0,15,0)');
    ctx.fillStyle = shade;
    ctx.fillRect(-earthR, -earthR, earthR * 2, earthR * 2);
    ctx.restore();
    ctx.restore();
    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(-AXIAL_TILT);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, -earthR - 12); ctx.lineTo(0, earthR + 12); ctx.stroke();
    ctx.fillStyle = '#9fd9ff';
    ctx.beginPath(); ctx.arc(0, -earthR - 12, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(232,238,249,0.85)';
    ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('N', 6, -earthR - 9);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(ex, ey, earthR, 0, Math.PI * 2); ctx.stroke();
    const axisX = Math.sin(AXIAL_TILT), axisY = -Math.cos(AXIAL_TILT);
    const sxToE = (ex - cx), syToE = (ey - cy);
    const lenSE = Math.hypot(sxToE, syToE) || 1;
    const dot = -(axisX * sxToE / lenSE + axisY * syToE / lenSE);
    let nKey, sKey;
    if (dot > 0.6) { nKey = 'summer'; sKey = 'winter'; }
    else if (dot > 0.05) { nKey = 'spring'; sKey = 'autumn'; }
    else if (dot < -0.6) { nKey = 'winter'; sKey = 'summer'; }
    else if (dot < -0.05) { nKey = 'autumn'; sKey = 'spring'; }
    else { nKey = 'equinox'; sKey = 'equinox'; }
    ctx.fillStyle = 'rgba(232,238,249,0.95)';
    ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${t('hemisphere_north')} : ${t(nKey)}`, ex, ey - earthR - 22);
    ctx.fillStyle = 'rgba(232,238,249,0.6)';
    ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillText(`${t('hemisphere_south')} : ${t(sKey)}`, ex, ey - earthR - 8);

    // ===== Moon orbiting Earth =====
    const MOONS_PER_YEAR = 12.37; // synodic cycles per Earth year
    const moonAngleAroundEarth = progress * Math.PI * 2 * MOONS_PER_YEAR;
    const moonOrbitPx = earthR * 1.9;
    // Moon orbits in Earth's frame; project flat (small ellipse)
    const mx = ex + Math.cos(moonAngleAroundEarth) * moonOrbitPx;
    const my = ey + Math.sin(moonAngleAroundEarth) * moonOrbitPx * 0.35;
    const moonR = Math.max(4, earthR * 0.18);
    // Moon orbit ring
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.setLineDash([2, 4]);
    ctx.beginPath();
    ctx.ellipse(ex, ey, moonOrbitPx, moonOrbitPx * 0.35, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Eclipse alignment: in this view, the moon-earth-sun line lines up when moon is between earth and sun (toward sun = positive x direction since sun is at cx, cy)
    // Direction earth->sun:
    const eToSunAngle = Math.atan2(cy - ey, cx - ex);
    // Phase angle: angle between (moon from earth) and (sun from earth)
    const moonRelAngle = Math.atan2(Math.sin(moonAngleAroundEarth) * 0.35, Math.cos(moonAngleAroundEarth));
    // Normalised difference
    let phaseDelta = moonRelAngle - eToSunAngle;
    while (phaseDelta < -Math.PI) phaseDelta += Math.PI * 2;
    while (phaseDelta > Math.PI) phaseDelta -= Math.PI * 2;
    // illumination 0..1: 0 = new (moon at sun side), 1 = full (opposite)
    const illum = (1 - Math.cos(phaseDelta)) / 2;
    const waxing = Math.sin(phaseDelta) > 0;

    // Eclipse cone — solar eclipse: moon between earth and sun
    if (Math.abs(phaseDelta) < 0.18) {
      ctx.save();
      const grad = ctx.createLinearGradient(mx, my, ex, ey);
      grad.addColorStop(0, 'rgba(0,0,15,0.5)');
      grad.addColorStop(1, 'rgba(0,0,15,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(mx, my - moonR * 0.6);
      ctx.lineTo(ex, ey - earthR * 0.4);
      ctx.lineTo(ex, ey + earthR * 0.4);
      ctx.lineTo(mx, my + moonR * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Moon body with day/night
    ctx.save();
    ctx.beginPath(); ctx.arc(mx, my, moonR, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#cfcfcf';
    ctx.fillRect(mx - moonR, my - moonR, moonR * 2, moonR * 2);
    // crater
    ctx.fillStyle = 'rgba(120,120,120,0.5)';
    ctx.beginPath(); ctx.arc(mx - moonR*0.3, my - moonR*0.4, moonR*0.18, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + moonR*0.4, my + moonR*0.2, moonR*0.22, 0, Math.PI*2); ctx.fill();
    // Shadow on moon based on sun direction (sun at cx, cy)
    const sunDirX = (cx - mx), sunDirY = (cy - my);
    const sunDirLen = Math.hypot(sunDirX, sunDirY) || 1;
    const sdx = sunDirX / sunDirLen, sdy = sunDirY / sunDirLen;
    ctx.save();
    ctx.translate(mx, my);
    const shadAng = Math.atan2(sdy, sdx);
    ctx.rotate(shadAng);
    const moonShade = ctx.createLinearGradient(-moonR, 0, moonR, 0);
    moonShade.addColorStop(0, 'rgba(0,0,15,0.85)');
    moonShade.addColorStop(0.45, 'rgba(0,0,15,0.55)');
    moonShade.addColorStop(0.55, 'rgba(0,0,15,0)');
    moonShade.addColorStop(1, 'rgba(0,0,15,0)');
    ctx.fillStyle = moonShade;
    ctx.fillRect(-moonR, -moonR, moonR * 2, moonR * 2);
    ctx.restore();
    // Lunar eclipse — full moon alignment: earth shadow on moon
    if (Math.abs(Math.abs(phaseDelta) - Math.PI) < 0.18) {
      const lunShadow = ctx.createRadialGradient(mx, my, 0, mx, my, moonR);
      lunShadow.addColorStop(0, 'rgba(140,40,30,0.85)');
      lunShadow.addColorStop(0.7, 'rgba(80,20,20,0.6)');
      lunShadow.addColorStop(1, 'rgba(40,10,10,0.4)');
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = lunShadow;
      ctx.beginPath(); ctx.arc(mx, my, moonR, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(mx, my, moonR, 0, Math.PI * 2); ctx.stroke();

    // Moon label
    if (earthR > 25) {
      ctx.fillStyle = 'rgba(232,238,249,0.7)';
      ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(lang === 'uk' ? 'Місяць' : lang === 'en' ? 'Moon' : 'Lune', mx, my + moonR + 12);
    }

    // Update phase mini-display using the computed phase
    drawMoonPhase(phaseDelta);

    // Eclipse banner
    if (Math.abs(phaseDelta) < 0.08) {
      eclipseBanner.textContent = t('eclipse_solar');
      eclipseBanner.classList.add('visible');
    } else if (Math.abs(Math.abs(phaseDelta) - Math.PI) < 0.08) {
      eclipseBanner.textContent = t('eclipse_lunar');
      eclipseBanner.classList.add('visible');
    } else {
      eclipseBanner.classList.remove('visible');
    }

    // Save Earth screen geometry for drag handler
    earthDrag.earthScreen = {
      x: ex, y: ey, r: earthR,
      cx: cx, cy: cy,
      orbitR, orbitRy,
    };

    // Hover detection on Earth (for cursor + tooltip)
    if (mouse.active && !earthDrag.active) {
      const dx = mouse.x - ex, dy = mouse.y - ey;
      if (dx*dx + dy*dy < (earthR + 10) ** 2) {
        hoveredPlanet = {
          kind: 'earthDraggable', name: lang === 'uk' ? 'Земля' : lang === 'en' ? 'Earth' : 'Terre',
          info: t('drag_hint'), x: ex, y: ey,
        };
      }
    }
  }
  function drawSimpleContinents(R) {
    ctx.fillStyle = '#3d9b4f';
    const blobs = [
      [-0.55, -0.15, 0.30, 1.0], [-0.20, -0.30, 0.22, 0.9],
      [-0.45,  0.30, 0.28, 1.1], [ 0.30, -0.25, 0.32, 1.0],
      [ 0.55,  0.15, 0.15, 0.9], [ 0.45,  0.45, 0.10, 1.0],
    ];
    for (const [bx, by, br, sq] of blobs) {
      ctx.save();
      ctx.translate(bx * R, by * R); ctx.scale(1, sq);
      ctx.beginPath(); ctx.arc(0, 0, br * R, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(0, 0, R * 0.15, 0, Math.PI * 2); ctx.fill();
  }

  // ============ Comparator (interactive) ============
  function compareViewFor(body, viewW, viewH) {
    // Center on body, zoom so the body fills ~35% of the shorter viewport side
    const target = Math.min(viewW, viewH) * 0.35;
    const zoom = Math.max(1e-11, target / body.diameter);
    return { offsetX: body.x, offsetY: body.y, zoom };
  }
  function compareViewWhole(viewW, viewH) {
    // Fit all orbits: Neptune diameter ≈ 60 AU. Center on Sun.
    const diameterKm = 2.2 * 30.05 * AU_KM;
    const target = Math.min(viewW, viewH) * 0.85;
    return { offsetX: 0, offsetY: 0, zoom: target / diameterKm };
  }
  function compareFlyTo(bodyId) {
    const body = COMPARATOR_BODIES.find(b => b.id === bodyId);
    if (!body) return;
    const v = compareViewFor(body, window.innerWidth, window.innerHeight);
    comparator.startState = { offsetX: comparator.offsetX, offsetY: comparator.offsetY, zoom: comparator.zoom };
    comparator.endState = v;
    comparator.animStart = performance.now() / 1000;
    comparator.animating = true;
    comparator.selected = bodyId;
    refreshFlyButtons();
  }
  function compareTickAnim(now) {
    if (!comparator.animating) return;
    const t = (now / 1000 - comparator.animStart) / comparator.animDur;
    if (t >= 1) {
      comparator.offsetX = comparator.endState.offsetX;
      comparator.offsetY = comparator.endState.offsetY;
      comparator.zoom = comparator.endState.zoom;
      comparator.animating = false;
      return;
    }
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    comparator.offsetX = comparator.startState.offsetX + (comparator.endState.offsetX - comparator.startState.offsetX) * e;
    comparator.offsetY = comparator.startState.offsetY + (comparator.endState.offsetY - comparator.startState.offsetY) * e;
    const lz1 = Math.log(comparator.startState.zoom);
    const lz2 = Math.log(comparator.endState.zoom);
    comparator.zoom = Math.exp(lz1 + (lz2 - lz1) * e);
  }
  function compareWorldToScreen(wx, wy, viewW, viewH) {
    return { sx: (wx - comparator.offsetX) * comparator.zoom + viewW / 2,
             sy: (wy - comparator.offsetY) * comparator.zoom + viewH / 2 };
  }
  function compareScreenToWorld(sx, sy, viewW, viewH) {
    return { wx: (sx - viewW / 2) / comparator.zoom + comparator.offsetX,
             wy: (sy - viewH / 2) / comparator.zoom + comparator.offsetY };
  }

  function drawCompare() {
    hoveredPlanet = null;
    const w = window.innerWidth, h = window.innerHeight;
    const now = performance.now();

    // Title
    ctx.fillStyle = 'rgba(232,238,249,0.9)';
    ctx.font = `bold ${w < 760 ? 14 : 18}px -apple-system, BlinkMacSystemFont, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(t('compare_title'), w / 2, w < 760 ? 62 : 100);

    // Sun's screen position
    const sunScreen = compareWorldToScreen(0, 0, w, h);

    // ===== Orbital rings (drawn first so they're behind the bodies) =====
    for (const body of COMPARATOR_BODIES) {
      if (body.isSun) continue;
      const orbitPx = body.orbitR * comparator.zoom;
      if (orbitPx < 8) continue; // too small to be useful
      // Only render the visible arc segment for performance: but Path API
      // doesn't trivially clip a circle. Skip if obviously off-screen.
      const maxR = Math.hypot(Math.max(Math.abs(sunScreen.sx), w - sunScreen.sx),
                              Math.max(Math.abs(sunScreen.sy), h - sunScreen.sy));
      const minR = Math.max(0,
        Math.hypot(Math.max(0, Math.max(-sunScreen.sx, sunScreen.sx - w)),
                   Math.max(0, Math.max(-sunScreen.sy, sunScreen.sy - h))));
      if (orbitPx < minR - 20) continue; // ring entirely outside viewport
      if (orbitPx > maxR + 200) continue; // ring entirely beyond viewport reach
      ctx.strokeStyle = hexA(body.color, 0.18);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(sunScreen.sx, sunScreen.sy, orbitPx, 0, Math.PI * 2);
      ctx.stroke();
    }

    // ===== Each body =====
    for (const body of COMPARATOR_BODIES) {
      const { sx, sy } = compareWorldToScreen(body.x, body.y, w, h);
      const realSr = body.diameter * comparator.zoom / 2;
      // Always show at least 3 px so we can spot bodies from far away
      const minSr = body.isSun ? 5 : 3;
      const sr = Math.max(minSr, realSr);
      const usingMinSize = realSr < minSr;
      // Off-screen?
      if (sx + sr < -10 || sx - sr > w + 10 || sy + sr < -10 || sy - sr > h + 10) continue;

      // Glow
      const glow = ctx.createRadialGradient(sx, sy, sr, sx, sy, sr * 2.4);
      glow.addColorStop(0, hexA(body.color, usingMinSize ? 0.55 : 0.35));
      glow.addColorStop(1, hexA(body.color, 0));
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(sx, sy, sr * 2.4, 0, Math.PI * 2); ctx.fill();

      // Body itself
      if (body.isSun) {
        const pulse = 1 + 0.04 * Math.sin(now / 800);
        const sg = ctx.createRadialGradient(sx - sr * 0.2, sy - sr * 0.2, sr * 0.1, sx, sy, sr * pulse);
        sg.addColorStop(0, '#fff5cc'); sg.addColorStop(0.6, '#ffd166'); sg.addColorStop(1, '#ff8c28');
        ctx.fillStyle = sg;
        ctx.beginPath(); ctx.arc(sx, sy, sr * pulse, 0, Math.PI * 2); ctx.fill();
      } else if (body.id === 2 && sr >= 14 && spherePixels && !usingMinSize) {
        // Realistic Earth when big enough
        const rot = now / 6000;
        renderEarthSphere(sx, sy, sr, rot * 2, state.settings.clouds);
        if (state.settings.atmosphere) drawAtmosphere(sx, sy, sr);
      } else {
        const grad = ctx.createRadialGradient(sx - sr * 0.4, sy - sr * 0.4, 0, sx, sy, sr);
        grad.addColorStop(0, lighten(body.color, 0.3));
        grad.addColorStop(1, body.color);
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
        // Rotation hint
        if (sr > 14 && !usingMinSize) {
          const rot = now / 6000 + body.x * 0.0000001;
          ctx.save();
          ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.clip();
          ctx.strokeStyle = 'rgba(255,255,255,0.08)';
          ctx.lineWidth = Math.max(1, sr * 0.06);
          ctx.beginPath();
          const a1 = rot % (Math.PI * 2);
          ctx.arc(sx, sy, sr * 0.85, a1, a1 + 0.6);
          ctx.stroke();
          ctx.restore();
        }
      }

      // Saturn rings
      if (body.hasRings && !usingMinSize) {
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(0.4); ctx.scale(1, 0.35);
        ctx.strokeStyle = 'rgba(232,211,156,0.75)';
        ctx.lineWidth = Math.max(1, sr * 0.06);
        ctx.beginPath(); ctx.arc(0, 0, sr * 1.8, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(232,211,156,0.4)';
        ctx.lineWidth = Math.max(0.5, sr * 0.04);
        ctx.beginPath(); ctx.arc(0, 0, sr * 2.15, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }

      // Earth's Moon when zoomed in enough
      if (body.hasMoon && !usingMinSize && sr > 12) {
        const moonOrbitKm = 384400;
        const moonOrbitPx = moonOrbitKm * comparator.zoom;
        if (moonOrbitPx > sr * 1.5) {
          const moonR = 1737 * comparator.zoom;
          const ma = now / 4000;
          const mx = sx + Math.cos(ma) * moonOrbitPx;
          const my = sy + Math.sin(ma) * moonOrbitPx;
          ctx.strokeStyle = 'rgba(255,255,255,0.10)';
          ctx.setLineDash([2, 4]);
          ctx.beginPath(); ctx.arc(sx, sy, moonOrbitPx, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = '#cfcfcf';
          ctx.beginPath(); ctx.arc(mx, my, Math.max(1.2, moonR), 0, Math.PI * 2); ctx.fill();
        }
      }

      // Labels with LOD
      const name = lname(body);
      // Always show name on hover/focus, but suppress when too zoomed in to avoid clutter
      const showName = !usingMinSize || sr >= minSr; // basically always since min is enforced
      if (showName) {
        const labelY = sy + sr + (w < 760 ? 12 : 14);
        ctx.fillStyle = 'rgba(232,238,249,0.9)';
        ctx.font = `bold ${w < 760 ? 11 : 13}px -apple-system, BlinkMacSystemFont, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(name, sx, labelY);
        // Extra info when the planet is comfortably visible
        if (realSr > 8 || (usingMinSize && comparator.selected === body.id)) {
          ctx.fillStyle = 'rgba(232,238,249,0.5)';
          ctx.font = `${w < 760 ? 9 : 11}px -apple-system, BlinkMacSystemFont, sans-serif`;
          ctx.fillText(`⌀ ${formatNumber(body.diameter)} km`, sx, labelY + 14);
          if (!body.isSun) {
            const ratio = body.diameter / 12742;
            const r = ratio < 1 ? ratio.toFixed(2) : ratio.toFixed(1);
            ctx.fillStyle = 'rgba(255,209,102,0.7)';
            ctx.fillText(`×${r} 🌍 · ${body.orbitR === 0 ? '' : (body.orbitR / AU_KM).toFixed(2) + ' UA'}`, sx, labelY + 28);
          }
        }
      }

      // Hover hit-test (slightly larger area for small bodies, makes them tappable)
      if (mouse.active && !hoveredPlanet) {
        const dx = mouse.x - sx, dy = mouse.y - sy;
        const hitR = Math.max(sr + 14, 18);
        if (dx * dx + dy * dy < hitR * hitR) {
          hoveredPlanet = {
            kind: body.isSun ? 'sun' : 'planet',
            name, info: lang === 'uk' ? 'натисни для деталей' : lang === 'en' ? 'click for details' : 'clic pour la fiche',
            x: sx, y: sy,
            planetIndex: body.isSun ? null : body.id,
          };
        }
      }
    }

    // Scale indicator at bottom-right
    drawCompareScale(w, h);

    // Off-screen arrows for bodies outside the viewport
    drawCompareArrows(w, h);
  }

  function drawCompareScale(w, h) {
    // 100px wide ruler showing what 100px corresponds to in km
    const lenPx = 100;
    const km = lenPx / comparator.zoom;
    let label;
    if (km > AU_KM * 0.5) label = `${(km / AU_KM).toFixed(2)} UA`;
    else if (km > 1e6) label = `${(km / 1e6).toFixed(1)} M km`;
    else if (km > 1e3) label = `${(km / 1e3).toFixed(0)} 000 km`;
    else label = `${km.toFixed(0)} km`;
    const y = h - 60;
    const x = w - lenPx - 24;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + lenPx, y);
    ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4);
    ctx.moveTo(x + lenPx, y - 4); ctx.lineTo(x + lenPx, y + 4);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, x + lenPx / 2, y - 8);
  }

  function drawCompareArrows(w, h) {
    // For each body off-screen, draw a small arrow at the screen edge pointing toward it
    for (const body of COMPARATOR_BODIES) {
      const { sx, sy } = compareWorldToScreen(body.x, body.y, w, h);
      const sr = Math.max(3, body.diameter * comparator.zoom / 2);
      if (sx + sr >= 0 && sx - sr <= w && sy + sr >= 0 && sy - sr <= h) continue;
      // Clamp to viewport edge with margin
      const margin = 24;
      const cxV = w / 2, cyV = h / 2;
      const dx = sx - cxV, dy = sy - cyV;
      const ang = Math.atan2(dy, dx);
      const ex = cxV + Math.cos(ang) * (Math.min(w, h) / 2 - margin);
      const ey = cyV + Math.sin(ang) * (Math.min(w, h) / 2 - margin);
      ctx.save();
      ctx.translate(ex, ey);
      ctx.rotate(ang);
      ctx.fillStyle = hexA(body.color, 0.85);
      ctx.beginPath();
      ctx.moveTo(8, 0); ctx.lineTo(-4, -5); ctx.lineTo(-4, 5);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = hexA(body.color, 0.8);
      ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      const labelX = ex - Math.cos(ang) * 18;
      const labelY = ey - Math.sin(ang) * 18;
      ctx.fillText(lname(body), labelX, labelY + 4);
    }
  }

  function buildFlyButtons() {
    const panel = $('comparePanel');
    panel.innerHTML = '';
    for (const body of COMPARATOR_BODIES) {
      const btn = document.createElement('button');
      btn.className = 'flyBtn';
      if (body.id === comparator.selected) btn.classList.add('active');
      const name = lname(body);
      btn.innerHTML = `<span class="dot" style="background:${body.color};color:${body.color}"></span>${name}`;
      btn.addEventListener('click', (e) => { e.stopPropagation(); compareFlyTo(body.id); });
      panel.appendChild(btn);
    }
  }
  function refreshFlyButtons() {
    document.querySelectorAll('#comparePanel .flyBtn').forEach((b, i) => {
      b.classList.toggle('active', COMPARATOR_BODIES[i].id === comparator.selected);
    });
  }

  // ============ Moon phase mini-display ============
  function drawMoonPhase(moonAngle) {
    const w = phaseCanvas.width, h = phaseCanvas.height;
    phaseCtx.clearRect(0, 0, w, h);
    const r = Math.min(w, h) / 2 - 8;
    const cx2 = w / 2, cy2 = h / 2;
    phaseCtx.fillStyle = '#1a1a22';
    phaseCtx.beginPath(); phaseCtx.arc(cx2, cy2, r, 0, Math.PI * 2); phaseCtx.fill();
    const illum = (1 - Math.cos(moonAngle)) / 2;
    const waxing = Math.sin(moonAngle) > 0;
    phaseCtx.save();
    phaseCtx.beginPath(); phaseCtx.arc(cx2, cy2, r, 0, Math.PI * 2); phaseCtx.clip();
    phaseCtx.fillStyle = '#e8e8e8';
    if (illum >= 0.5) {
      phaseCtx.fillRect(cx2 - r, cy2 - r, r * 2, r * 2);
      phaseCtx.fillStyle = '#1a1a22';
      phaseCtx.beginPath();
      if (waxing) phaseCtx.rect(cx2 - r, cy2 - r, r, r * 2);
      else phaseCtx.rect(cx2, cy2 - r, r, r * 2);
      phaseCtx.fill();
      const ew = r * (1 - 2 * (illum - 0.5)) * 2;
      phaseCtx.fillStyle = '#e8e8e8';
      phaseCtx.beginPath(); phaseCtx.ellipse(cx2, cy2, Math.abs(ew) / 2, r, 0, 0, Math.PI * 2); phaseCtx.fill();
      phaseCtx.fillStyle = '#e8e8e8';
      phaseCtx.beginPath();
      if (waxing) phaseCtx.rect(cx2, cy2 - r, r, r * 2);
      else phaseCtx.rect(cx2 - r, cy2 - r, r, r * 2);
      phaseCtx.fill();
    } else {
      const lit = waxing ? 1 : -1;
      phaseCtx.beginPath();
      if (lit === 1) phaseCtx.rect(cx2, cy2 - r, r, r * 2);
      else phaseCtx.rect(cx2 - r, cy2 - r, r, r * 2);
      phaseCtx.fill();
      phaseCtx.fillStyle = '#1a1a22';
      const ew = r * (1 - 2 * illum) * 2;
      phaseCtx.beginPath(); phaseCtx.ellipse(cx2, cy2, Math.abs(ew) / 2, r, 0, 0, Math.PI * 2); phaseCtx.fill();
    }
    phaseCtx.restore();
    phaseCtx.strokeStyle = 'rgba(255,255,255,0.2)'; phaseCtx.lineWidth = 1;
    phaseCtx.beginPath(); phaseCtx.arc(cx2, cy2, r, 0, Math.PI * 2); phaseCtx.stroke();
    $('phaseName').textContent = phaseName(illum, waxing);
    $('phaseIllum').textContent = `${(illum * 100).toFixed(0)} % ${lang === 'uk' ? 'освітленості' : lang === 'en' ? 'lit' : 'éclairée'}`;
  }
  function phaseName(illum, waxing) {
    if (lang === 'uk') {
      if (illum < 0.04) return 'Молодик';
      if (illum > 0.96) return 'Повний Місяць';
      if (Math.abs(illum - 0.5) < 0.06) return waxing ? 'Перша чверть' : 'Остання чверть';
      if (illum < 0.5) return waxing ? 'Молодий серп' : 'Старий серп';
      return waxing ? 'Зростаюча гібуса' : 'Спадна гібуса';
    }
    if (lang === 'en') {
      if (illum < 0.04) return 'New Moon';
      if (illum > 0.96) return 'Full Moon';
      if (Math.abs(illum - 0.5) < 0.06) return waxing ? 'First Quarter' : 'Last Quarter';
      if (illum < 0.5) return waxing ? 'Waxing Crescent' : 'Waning Crescent';
      return waxing ? 'Waxing Gibbous' : 'Waning Gibbous';
    }
    if (illum < 0.04) return 'Nouvelle Lune';
    if (illum > 0.96) return 'Pleine Lune';
    if (Math.abs(illum - 0.5) < 0.06) return waxing ? 'Premier Quartier' : 'Dernier Quartier';
    if (illum < 0.5) return waxing ? 'Premier Croissant' : 'Dernier Croissant';
    return waxing ? 'Gibbeuse Croissante' : 'Gibbeuse Décroissante';
  }
  function detectEclipse(moonAngle) {
    const a = ((moonAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const distToNew = Math.min(a, Math.abs(a - Math.PI * 2));
    const distToFull = Math.abs(a - Math.PI);
    if (distToNew < 0.05) { eclipseBanner.textContent = t('eclipse_solar'); eclipseBanner.classList.add('visible'); }
    else if (distToFull < 0.05) { eclipseBanner.textContent = t('eclipse_lunar'); eclipseBanner.classList.add('visible'); }
    else eclipseBanner.classList.remove('visible');
  }

  // ============ Tooltip ============
  function updateTooltip() {
    if (hoveredPlanet) {
      tooltip.classList.add('show');
      tooltip.querySelector('.name').textContent = hoveredPlanet.name;
      tooltip.querySelector('.info').textContent = hoveredPlanet.info;
      tooltip.style.left = (hoveredPlanet.x + 14) + 'px';
      tooltip.style.top = (hoveredPlanet.y - 10) + 'px';
      if (hoveredPlanet.kind === 'earthDraggable') canvas.style.cursor = earthDrag.active ? 'grabbing' : 'grab';
      else canvas.style.cursor = (hoveredPlanet.kind === 'planet' || hoveredPlanet.kind === 'sun') ? 'pointer' : 'default';
    } else {
      tooltip.classList.remove('show');
      canvas.style.cursor = 'default';
    }
  }

  // ============ Modals ============
  function openPlanetModal(idx) {
    const p = PLANETS[idx];
    const name = lname(p);
    modalSwatch.style.background = p.color;
    modalSwatch.style.color = p.color;
    modalTitle.textContent = name;
    modalType.textContent = p.type[lang];
    modalGrid.innerHTML = `
      <div class="stat"><div class="label">${t('planet_card_diameter')}</div><div class="value">${formatNumber(p.diameter)} km</div></div>
      <div class="stat">
        <div class="label">${t('planet_card_distance')}</div>
        <div class="value">${p.realDistanceAU} ${lang === 'uk' ? 'АО' : lang === 'en' ? 'AU' : 'UA'}</div>
        <div class="sub">${t('ua_note')} · ${auToKmShort(p.realDistanceAU)}</div>
      </div>
      <div class="stat"><div class="label">${t('planet_card_day')}</div><div class="value">${formatDay(p.dayHours)}</div></div>
      <div class="stat"><div class="label">${t('planet_card_year')}</div><div class="value">${formatPeriod(p.period)}</div></div>
      <div class="stat"><div class="label">${t('planet_card_moons')}</div><div class="value">${p.moons}</div></div>
      <div class="stat"><div class="label">${t('planet_card_rings')}</div><div class="value">${p.hasRings ? t('planet_card_yes') : t('planet_card_no')}</div></div>
    `;
    modalFact.textContent = '💡 ' + p.fact[lang];
    // Moons list
    modalMoons.innerHTML = '';

    const sliderHours = parseFloat(slider.value) / 60;

      hourLabel.textContent = '🌍 1';
      yearLabel.textContent = t('compare_earth_ref');
    } else if (state.earthMode === 'day') {
      const h = Math.floor(sliderHours);
      const m = Math.floor((sliderHours - h) * 60);
      hourLabel.textContent = `${String(h).padStart(2, '0')} h ${String(m).padStart(2, '0')}`;
      let key;
      if (sliderHours < 5 || sliderHours >= 21) key = 'lyon_night';
      else if (sliderHours < 8) key = 'lyon_dawn';
      else if (sliderHours < 18) key = 'lyon_day';
      else key = 'lyon_dusk';
      yearLabel.textContent = t(key);
    } else if (state.earthMode === 'month') {
      const day = (sliderHours / 24) * LUNAR_MONTH_DAYS;
      hourLabel.textContent = t('day_n', { n: day.toFixed(1) });
      yearLabel.textContent = t('lunar_cycle');
    } else {
      const day = (sliderHours / 24) * 365;
      const months = lang === 'en'
        ? ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
        : ['Janv','Févr','Mars','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'];
      const monthIdx = Math.min(11, Math.floor(day / 30.4));
      hourLabel.textContent = months[monthIdx];
      yearLabel.textContent = t('day_of_year', { n: day.toFixed(0) });
    }

  // ============ Audio ============
  let audioCtx = null, audioNodes = null;
  function startAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (audioNodes) return;
      const masterGain = audioCtx.createGain();
      masterGain.gain.value = 0; masterGain.connect(audioCtx.destination);
      masterGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 1.5);
      const o1 = audioCtx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 60;
      const o2 = audioCtx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 90;
      const o3 = audioCtx.createOscillator(); o3.type = 'triangle'; o3.frequency.value = 220; o3.detune.value = 8;
      const filt = audioCtx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 600;
      const g1 = audioCtx.createGain(); g1.gain.value = 0.6;
      const g2 = audioCtx.createGain(); g2.gain.value = 0.4;
      const g3 = audioCtx.createGain(); g3.gain.value = 0.06;
      o1.connect(g1).connect(filt); o2.connect(g2).connect(filt);
      o3.connect(g3).connect(masterGain); filt.connect(masterGain);
      const lfo = audioCtx.createOscillator(); lfo.frequency.value = 0.07;
      const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 200;
      lfo.connect(lfoGain).connect(filt.frequency);
      o1.start(); o2.start(); o3.start(); lfo.start();
      audioNodes = { masterGain, oscs: [o1, o2, o3, lfo] };
    } catch (e) { console.warn('Audio failed:', e); }
  }
  function stopAudio() {
    if (!audioNodes || !audioCtx) return;
    const tt = audioCtx.currentTime;
    audioNodes.masterGain.gain.cancelScheduledValues(tt);
    audioNodes.masterGain.gain.setValueAtTime(audioNodes.masterGain.gain.value, tt);
    audioNodes.masterGain.gain.linearRampToValueAtTime(0, tt + 0.6);
    setTimeout(() => {
      if (!audioNodes) return;
      for (const o of audioNodes.oscs) try { o.stop(); } catch {}
      audioNodes = null;
    }, 700);
  }

    tourTextEl.textContent = step[lang];
    tourProgress.style.width = '0%';
    if (step.view && step.view !== state.view) setView(step.view);
    if (step.mode && step.mode !== state.earthMode) {

      updateSliderLabels(); updateLabels();

    tourProgress.style.width = Math.min(100, (tourState.elapsed / step.dur) * 100) + '%';

  // ============ Main loop ============
  let prev = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - prev) / 1000);
    prev = now;
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    if (playing) {
      const advance = (1440 / 30) * speed * dt;
      let v = parseFloat(slider.value) + advance;
      if (v >= 1440) v = 0;
      slider.value = v;
      updateLabels();
    }
    drawBackground(w, h, dt);
    if (state.view === 'compare') {
      compareTickAnim(now);
      // Apply pan inertia after release
      if (!comparator.dragging && !comparator.animating) {
        const speed2 = comparator.velocityX * comparator.velocityX + comparator.velocityY * comparator.velocityY;
        if (speed2 > 4) {
          comparator.offsetX -= comparator.velocityX * dt / comparator.zoom;
          comparator.offsetY -= comparator.velocityY * dt / comparator.zoom;
          // Exponential decay (~ -85%/sec)
          const decay = Math.pow(0.04, dt);
          comparator.velocityX *= decay;
          comparator.velocityY *= decay;
        } else {
          comparator.velocityX = 0; comparator.velocityY = 0;
        }
      }
    }
    if (state.view === 'solar') drawSolar(parseFloat(slider.value) / 60, dt);
    else if (state.view === 'compare') drawCompare();
    else if (state.earthMode === 'season') drawSeasons(parseFloat(slider.value) / 60);
    else drawEarth(parseFloat(slider.value) / 60, dt);
    updateTooltip();
    tourTick(dt);
    requestAnimationFrame(loop);
  }

  // ============ First-visit language picker ============
  (function maybeShowLangPicker() {
    if (localStorage.getItem('lang')) return; // user already chose
    const picker = $('langPicker');
    picker.classList.add('visible');
    picker.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        lang = btn.dataset.lang;
        localStorage.setItem('lang', lang);
        applyLang();
        picker.classList.remove('visible');
      });
    });
  })();

  // ============ Init ============
  resize();
  buildEarthTextures();
  buildSpherePixels(EARTH_RADIUS, VIEW_TILT);
  applyLang();
  syncToggleVisuals();
  updateSettingsAvailability();
  if (state.settings.issLive) startISSPolling();
  if (state.settings.sound) startAudio();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
