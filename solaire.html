<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffd166" />
<title>Le Système Solaire — Voyage interactif</title>
<link rel="icon" type="image/svg+xml" href="favicon-ss.svg" />

<link rel="apple-touch-icon" href="favicon-ss.svg" />
<style>
  :root {
    --bg-deep: #02030a; --bg-mid: #070a1a;
    --accent: #ffd166; --text: #e8eef9; --muted: #8892b0;
    --panel: rgba(12, 18, 36, 0.85); --panel-border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at center, var(--bg-mid) 0%, var(--bg-deep) 70%);
    overflow: hidden;
  }
  #stage { position: relative; width: 100vw; height: 100vh; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 18px 24px;
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 18px; pointer-events: none; z-index: 5;
  }
  .topbar > div:first-child { transition: opacity 0.2s; }
  body.earth-view .topbar > div:first-child { display: none; }
  body.earth-view .topbar { justify-content: flex-end; }

  .titleRow { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
  .menuBtn {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 50%; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); font-size: 18px; font-weight: 400; line-height: 1;
    cursor: pointer; padding: 0;
    transition: background 0.2s, transform 0.25s, color 0.2s;
    flex-shrink: 0;
  }
  .menuBtn:hover { background: rgba(255,255,255,0.08); }
  .menuBtn.open { background: var(--accent); color: #02030a; transform: rotate(45deg); }

  .menuDropdown {
    position: absolute; top: 56px; left: 24px; z-index: 9;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 6px; min-width: 230px;
    backdrop-filter: blur(10px); pointer-events: auto;
    display: none; flex-direction: column; gap: 2px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .menuDropdown.open { display: flex; }
  .menuDropdown .menuHeader {
    padding: 6px 12px 10px; font-size: 10px; color: var(--accent);
    text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--panel-border);
    margin-bottom: 4px;
  }
  .menuItem {
    padding: 10px 12px; border-radius: 8px; color: var(--text);
    text-decoration: none; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
    transition: background 0.15s;
  }
  .menuItem:hover { background: rgba(255,255,255,0.06); }
  .menuItem.active {
    background: rgba(255,209,102,0.12); color: var(--accent);
    cursor: default;
  }
  .menuItem .ext { color: var(--muted); font-size: 11px; margin-left: auto; font-weight: 400; }

  .backBtn {
    position: absolute; top: 18px; left: 24px; z-index: 7;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 10px 16px; font-size: 14px;
    color: var(--text); cursor: pointer; backdrop-filter: blur(10px);
    pointer-events: auto; font-weight: 600;
    display: none; align-items: center; gap: 8px;
    transition: background 0.15s, transform 0.15s;
  }
  .backBtn:hover { background: rgba(255,255,255,0.06); transform: translateX(-2px); }
  .backBtn.visible { display: inline-flex; }
  .backBtn .arrow { font-size: 18px; line-height: 1; }
  .backBtn .titleSmall { font-size: 14px; }
  .backBtn .planetName { color: var(--accent); font-weight: 700; margin-left: 4px; }

  .earthDataCard {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 14px 16px; backdrop-filter: blur(10px);
    font-size: 12px;
  }
  .earthDataCard h3 {
    margin: 0 0 4px 0; font-size: 16px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .earthDataCard h3 .swatch {
    width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 8px currentColor;
  }
  .earthDataCard .ptype { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
  .earthDataCard .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-bottom: 10px; }
  .earthDataCard .stat .label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .earthDataCard .stat .value { font-size: 13px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .earthDataCard .stat .sub { font-size: 9px; color: var(--muted); font-weight: 400; }
  .earthDataCard .efact {
    background: rgba(255, 209, 102, 0.1); border-left: 2px solid var(--accent);
    padding: 8px 10px; border-radius: 4px; font-size: 11px;
    color: #fff5d6; font-style: italic; line-height: 1.4;
  }
  .earthDataCard .moonsMini { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--panel-border); }
  .earthDataCard .moonsMini h4 { margin: 0 0 6px 0; font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
  .earthDataCard .moonRow { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 2px 0; }
  .earthDataCard .moonRow .moonDot { width: 7px; height: 7px; border-radius: 50%; background: #d4d4d8; flex-shrink: 0; }
  .earthDataCard .moonRow .moonName { color: var(--text); font-weight: 600; }
  .earthDataCard .moonRow .moonInfo { color: var(--muted); font-size: 10px; margin-left: auto; }
  .title { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
  .title span { color: var(--accent); }
  .subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .tabs {
    display: inline-flex; margin-top: 10px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 4px; backdrop-filter: blur(10px);
    pointer-events: auto; flex-wrap: wrap;
  }
  .tab {
    background: transparent; border: none; color: var(--muted);
    padding: 7px 14px; border-radius: 7px; font-size: 13px;
    font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s;
    text-decoration: none; display: inline-block;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent); color: #02030a; }

  .topRight { display: flex; gap: 10px; align-items: stretch; pointer-events: auto; }
  .clock {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 10px 18px; text-align: right;
    backdrop-filter: blur(10px); min-width: 160px;
  }
  .clock .hour { font-size: 26px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .clock .year { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .iconBtn {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; width: 44px; height: 44px; align-self: center;
    color: var(--text); font-size: 18px; cursor: pointer;
    backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, background 0.15s;
  }
  .iconBtn:hover { background: rgba(255,255,255,0.06); }
  .iconBtn.gear:hover { transform: rotate(45deg); }

  .settings {
    position: absolute; top: 90px; right: 24px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 12px; backdrop-filter: blur(10px);
    z-index: 8; min-width: 260px; display: none; max-height: 80vh; overflow-y: auto;
  }
  .settings.open { display: block; }
  .settings h4 {
    margin: 4px 6px 8px; font-size: 11px; color: var(--accent);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
    user-select: none;
  }
  .toggle:hover { background: rgba(255,255,255,0.04); }
  .toggle.disabled { opacity: 0.4; cursor: not-allowed; }
  .switch {
    width: 36px; height: 20px; background: rgba(255,255,255,0.15);
    border-radius: 10px; position: relative; transition: background 0.2s;
    flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; left: 2px; top: 2px;
    width: 16px; height: 16px; background: #fff; border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle.on .switch { background: var(--accent); }
  .toggle.on .switch::after { transform: translateX(16px); }

  .settingsAction {
    width: 100%; background: rgba(255,255,255,0.04);
    color: var(--text); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 9px 12px; font-size: 13px;
    cursor: pointer; margin: 4px 0; text-align: left;
    font-weight: 600;
  }
  .settingsAction:hover { background: rgba(255,255,255,0.08); }
  .settingsAction.primary {
    background: var(--accent); color: #02030a; border-color: var(--accent);
  }
  .langToggle {
    display: flex; gap: 4px; padding: 6px 10px;
  }
  .langToggle button {
    flex: 1; background: rgba(255,255,255,0.05);
    color: var(--muted); border: 1px solid var(--panel-border);
    border-radius: 7px; padding: 6px 10px; font-size: 13px;
    cursor: pointer; font-weight: 600;
  }
  .langToggle button.active { background: var(--accent); color: #02030a; border-color: var(--accent); }

  .panel {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 16px; padding: 14px 22px 18px;
    min-width: min(680px, 92vw); backdrop-filter: blur(10px); z-index: 5;
  }
  .sub-toggle {
    display: none; justify-content: center; gap: 4px;
    background: rgba(0, 0, 0, 0.3); border-radius: 8px; padding: 3px;
    margin: 0 auto 12px; width: fit-content;
  }
  .sub-toggle.visible { display: flex; }
  .sub-toggle button {
    background: transparent; color: var(--muted); border: none;
    padding: 6px 12px; border-radius: 6px; font-size: 12px;
    cursor: pointer; font-weight: 600;
  }
  .sub-toggle button.active { background: var(--accent); color: #02030a; }

  .panel-row { display: flex; align-items: center; gap: 14px; }
  .play-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); color: #02030a; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s; flex-shrink: 0;
  }
  .play-btn:hover { transform: scale(1.08); }

  .slider-wrap { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .slider-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
    background: linear-gradient(to right, #ff6b6b 0%, #ffd166 25%, #06d6a0 50%, #118ab2 75%, #7b2cbf 100%);
    border-radius: 3px; outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; border: 3px solid var(--accent);
    cursor: grab; box-shadow: 0 0 12px rgba(255, 209, 102, 0.6);
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%; background: #fff;
    border: 3px solid var(--accent); cursor: grab; box-shadow: 0 0 12px rgba(255, 209, 102, 0.6);
  }
  .speed-toggle {
    display: flex; gap: 4px; background: rgba(0, 0, 0, 0.3);
    border-radius: 8px; padding: 3px; flex-shrink: 0;
  }
  .speed-toggle button {
    background: transparent; color: var(--muted); border: none;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    cursor: pointer; font-weight: 600;
  }
  .speed-toggle button.active { background: var(--accent); color: #02030a; }

  .infoCard {
    position: absolute; top: 150px; left: 24px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 14px 16px; backdrop-filter: blur(10px);
    z-index: 5; font-size: 12px; max-width: 260px; display: none;
    max-height: calc(100vh - 250px); overflow-y: auto;
  }
  .infoCard.visible { display: block; }
  .infoCard h3 { margin: 0 0 10px 0; font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
  .infoCard h4 { margin: 12px 0 6px 0; font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: background 0.15s; }
  .legend-item:hover { background: rgba(255, 255, 255, 0.05); }
  .legend-item.focused { background: rgba(255, 209, 102, 0.12); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-dot.earthPulse {
    animation: earthDotPulse 2.2s ease-in-out infinite;
    position: relative;
  }
  @keyframes earthDotPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74, 158, 255, 0.55); transform: scale(1); }
    50%      { box-shadow: 0 0 0 4px rgba(74, 158, 255, 0);    transform: scale(1.18); }
  }
  .legend-item.earthRow:hover { background: rgba(74, 158, 255, 0.08); }

  .scaleChips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .scaleChips button {
    background: rgba(255,255,255,0.05); color: var(--muted);
    border: 1px solid var(--panel-border); border-radius: 7px;
    padding: 4px 8px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .scaleChips button:hover { background: rgba(255,255,255,0.1); color: var(--text); }
  .scaleChips button.active { background: var(--accent); color: #02030a; border-color: var(--accent); }

  .followBadge {
    margin-top: 8px; padding: 6px 10px; border-radius: 7px;
    background: rgba(255, 209, 102, 0.1); border: 1px solid rgba(255, 209, 102, 0.3);
    font-size: 11px; color: #fff5d6; display: none;
  }
  .followBadge.visible { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .followBadge button { background: transparent; color: var(--muted); border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
  .followBadge button:hover { color: var(--text); background: rgba(255,255,255,0.06); }

  .rightStack {
    position: absolute; top: 140px; right: 24px;
    display: none; flex-direction: column; gap: 12px;
    z-index: 5; width: 220px;
    max-height: calc(100vh - 170px); overflow-y: auto;
    padding-right: 2px;
  }
  .rightStack.visible { display: flex; }
  .phaseCard {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 14px 16px; backdrop-filter: blur(10px);
    font-size: 12px; text-align: center;
  }
  .phaseCard h3 { margin: 0 0 10px 0; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
  #phaseCanvas { position: static; width: 90px; height: 90px; display: block; margin: 0 auto 8px; }
  .phaseName { font-weight: 600; color: var(--text); }
  .phaseIllumination { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .eclipseBanner {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(120, 30, 30, 0.85); border: 1px solid rgba(255,100,100,0.4);
    border-radius: 10px; padding: 8px 18px; font-weight: 600;
    z-index: 7; display: none; backdrop-filter: blur(10px);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .eclipseBanner.visible { display: block; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(255,100,100,0.4); }
    50% { box-shadow: 0 0 20px rgba(255,100,100,0.7); }
  }

  /* Tour banner */
  .tourBanner {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--panel); border: 2px solid var(--accent);
    border-radius: 16px; padding: 20px 26px;
    max-width: min(520px, 90vw); text-align: center;
    backdrop-filter: blur(10px); z-index: 18;
    display: none; box-shadow: 0 10px 40px rgba(255,209,102,0.25);
  }
  .tourBanner.visible { display: block; animation: tourIn 0.3s ease-out; }
  @keyframes tourIn { from { opacity: 0; transform: translate(-50%, -42%); } to { opacity: 1; transform: translate(-50%, -50%); } }
  .tourBanner .step { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .tourBanner .text { font-size: 17px; line-height: 1.45; margin-bottom: 16px; }
  .tourBanner .controls { display: flex; gap: 8px; justify-content: center; }
  .tourBanner .controls button {
    background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 8px 14px; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  .tourBanner .controls button.primary { background: var(--accent); color: #02030a; border-color: var(--accent); }
  .tourBanner .progress { height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-bottom: 14px; overflow: hidden; }
  .tourBanner .progressFill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s linear; }

  .tooltip {
    position: absolute; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; pointer-events: none;
    backdrop-filter: blur(10px); z-index: 10; opacity: 0; transition: opacity 0.15s;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .name { color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .tooltip .info { color: var(--muted); font-size: 11px; }

  .modal {
    position: absolute; inset: 0; background: rgba(2, 3, 10, 0.7);
    backdrop-filter: blur(6px); display: none;
    align-items: center; justify-content: center; z-index: 20;
  }
  .modal.visible { display: flex; }
  .modal-card {
    background: linear-gradient(135deg, rgba(20,28,52,0.95), rgba(10,15,30,0.95));
    border: 1px solid var(--panel-border); border-radius: 18px;
    padding: 28px 32px; max-width: 540px; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative; max-height: 88vh; overflow-y: auto;
  }
  .modal-card .close {
    position: absolute; top: 14px; right: 14px;
    background: transparent; border: none; color: var(--muted);
    font-size: 22px; cursor: pointer; width: 32px; height: 32px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .modal-card .close:hover { background: rgba(255,255,255,0.08); color: var(--text); }
  .modal-card h2 { margin: 0 0 4px 0; font-size: 26px; display: flex; align-items: center; gap: 12px; }
  .modal-card h2 .swatch { width: 28px; height: 28px; border-radius: 50%; box-shadow: 0 0 16px currentColor; }
  .modal-card .type { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .modal-card .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-bottom: 16px; }
  .modal-card .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .modal-card .stat .value { font-size: 15px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .modal-card .stat .sub { font-size: 10px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .modal-card .fact {
    background: rgba(255, 209, 102, 0.1); border-left: 3px solid var(--accent);
    padding: 10px 14px; border-radius: 4px; font-size: 13px;
    color: #fff5d6; font-style: italic;
  }
  .moonsList { margin-top: 14px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; }
  .moonsList h3 { margin: 0 0 8px 0; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
  .moonRow { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 13px; }
  .moonRow .moonDot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .moonRow .moonName { color: var(--text); font-weight: 600; min-width: 90px; }
  .moonRow .moonInfo { color: var(--muted); font-size: 11px; }

  .modal-card .actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
  .modal-card .btn { border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; transition: transform 0.15s; }
  .modal-card .btn-primary { background: var(--accent); color: #02030a; }
  .modal-card .btn-primary:hover { transform: translateY(-1px); }
  .modal-card .btn-ghost { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--panel-border); }
  .modal-card .btn-ghost:hover { background: rgba(255,255,255,0.1); }

  /* Glossary */
  .glossary dt { font-weight: 700; color: var(--accent); margin-top: 12px; font-size: 14px; }
  .glossary dt:first-of-type { margin-top: 0; }
  .glossary dd { margin: 4px 0 0 0; color: var(--text); font-size: 13px; line-height: 1.45; }

  /* Comparator fly-to bar */
  .comparePanel {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 6px; z-index: 6;
    backdrop-filter: blur(10px); display: none;
    max-width: calc(100vw - 24px); overflow-x: auto;
    white-space: nowrap; -webkit-overflow-scrolling: touch;
  }

  // ============ Stars + Milky Way ============
  let stars = [];
  function generateStars(w, h) {
    stars = [];
    const count = Math.floor((w * h) / 4000);
    // Milky way band: stars concentrated along a diagonal
    for (let i = 0; i < count; i++) {
      let x = Math.random() * w, y = Math.random() * h;
      stars.push({ x, y, r: Math.random() * 1.3 + 0.2, a: Math.random() * 0.7 + 0.3, twinkle: Math.random() * Math.PI * 2 });
    }
    // Extra Milky Way stars along diagonal band
    if (state.settings.milkyway) {
      const extra = Math.floor((w * h) / 6000);
      for (let i = 0; i < extra; i++) {
        // diagonal band from top-left to bottom-right with some thickness
        const along = Math.random();
        const across = (Math.random() - 0.5) * 0.18;
        const u = along + across;
        const v = along - across;
        const x = u * w;
        const y = v * h;
        if (x < 0 || x > w || y < 0 || y > h) continue;
        stars.push({ x, y, r: Math.random() * 0.9 + 0.2, a: Math.random() * 0.6 + 0.25, twinkle: Math.random() * Math.PI * 2, mw: true });
      }
    }
  }

  let shootingStar = null;
  function maybeSpawnShootingStar(w, h) {
    if (shootingStar) return;
    if (Math.random() < 0.003) {
      shootingStar = { x: Math.random() * w * 0.5, y: Math.random() * h * 0.3,
        vx: 180 + Math.random() * 120, vy: 80 + Math.random() * 80, life: 1.0 };
    }
  }

  let comet = null, cometCooldown = 6;
  function maybeSpawnComet(w, h, dt) {
    if (!state.settings.comet || state.view !== 'solar') { comet = null; return; }
    cometCooldown -= dt;
    if (comet || cometCooldown > 0) return;
    if (Math.random() < 0.4) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.max(w, h) * 0.7;
      comet = {
        x: cx + Math.cos(angle) * dist, y: cy + Math.sin(angle) * dist,
        vx: -Math.cos(angle) * 70 + Math.sin(angle) * 30 * side,
        vy: -Math.sin(angle) * 70 - Math.cos(angle) * 30 * side, life: 1,
      };
      cometCooldown = 12 + Math.random() * 8;
    } else cometCooldown = 4;
  }

  // ============ Sizing ============
  let cx = 0, cy = 0, scale = 1;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = w / 2; cy = h / 2;
    const topReserved = w < 760 ? 110 : 130;
    const bottomReserved = w < 760 ? 130 : 150;
    const vAvail = h - topReserved - bottomReserved;
    const hAvail = w - 40;
    const available = Math.max(120, Math.min(hAvail, vAvail) / 2);
    scale = available / 450;
    displayScale = Math.max(0.55, Math.min(1, scale * 1.6));
    const minDim = Math.min(w, h);
    const newEarthR = Math.max(38, Math.min(64, Math.floor(minDim * 0.10)));
    MOON_RADIUS = Math.max(8, Math.floor(newEarthR * 0.22));
    MOON_ORBIT_RADIUS = Math.max(120, Math.min(220, Math.floor(minDim * 0.30)));
    if (newEarthR !== EARTH_RADIUS) {
      EARTH_RADIUS = newEarthR;
      if (earthTexClear) buildSpherePixels(EARTH_RADIUS, VIEW_TILT);
    }
    generateStars(w, h);
  }
